<!-- notes/templates/notes/note_list.html -->
{% extends 'base.html' %}

{% block content %}
<a href="{% url 'note_create' %}" class="btn create-btn">+ Create New Note</a>

<div class="notes-container">
    {% for note in notes %}
        <div class="sticky-note">
            <div>
                <h3><a href="{% url 'note_detail' pk=note.pk %}">{{ note.title }}</a></h3>
                <p>{{ note.content|truncatewords:20 }}</p>
            </div>
        </div>
    {% empty %}
        <p>No notes available. Click above to create one!</p>
    {% endfor %}
</div>
{% endblock %}
